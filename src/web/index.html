<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-800 antialiased">
  <div x-data="app()" class="flex h-screen overflow-hidden">
    <!-- 左侧历史边栏（固定高度，自身可滚） -->
    <aside class="w-64 shrink-0 border-r border-neutral-200 bg-white px-3 py-5 hidden md:flex md:flex-col h-screen">
      <button @click="newRun()"
              class="w-full mb-4 px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">
        + 新建提取
      </button>
      <!-- 列表区：运行中 + 已完成 两组，占据剩余高度并独立滚动 -->
      <div class="flex-1 overflow-y-auto min-h-0">
        <!-- 运行中分组（有在跑任务时才显示） -->
        <template x-if="runningRuns.length">
          <div class="mb-4">
            <div class="text-xs font-semibold text-indigo-500 uppercase tracking-wide mb-2 px-1">运行中</div>
            <div class="space-y-1">
              <template x-for="h in runningRuns" :key="h.run_id">
                <button @click="openHistory(h.run_id)"
                        class="w-full text-left px-3 py-2 rounded-lg hover:bg-neutral-50 transition-colors"
                        :class="viewing === h.run_id ? 'bg-indigo-50 ring-1 ring-indigo-200' : ''">
                  <div class="flex items-center gap-2">
                    <span class="w-3 h-3 shrink-0 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></span>
                    <span class="text-sm text-neutral-800 truncate" x-text="h.project_name"></span>
                  </div>
                  <div class="text-xs text-indigo-400 mt-0.5 pl-5">处理中…</div>
                </button>
              </template>
            </div>
          </div>
        </template>
        <!-- 已完成分组 -->
        <div class="text-xs font-semibold text-neutral-400 uppercase tracking-wide mb-2 px-1">已完成</div>
        <div class="space-y-1">
          <template x-for="h in doneRuns" :key="h.run_id">
            <!-- group + relative：行 hover 时右侧浮出删除按钮（绝对定位，避免按钮嵌套按钮） -->
            <div class="group relative rounded-lg hover:bg-neutral-50 transition-colors"
                 :class="viewing === h.run_id ? 'bg-indigo-50 ring-1 ring-indigo-200' : ''">
              <button @click="openHistory(h.run_id)" class="w-full text-left px-3 py-2">
                <div class="text-sm text-neutral-800 truncate pr-6" x-text="h.project_name"></div>
                <div class="text-xs text-neutral-400 mt-0.5">
                  <span x-text="(h.coverage ? (h.coverage.mapped_scoring_items+h.coverage.mapped_tech_items+h.coverage.mapped_biz_items) : 0) + ' 项要求'"></span>
                </div>
              </button>
              <!-- 删除按钮：平时隐藏，hover 整行才显形；hover 自身转红；.stop 阻止冒泡到 openHistory -->
              <button @click.stop="deleteRun(h.run_id, h.project_name)" type="button" title="删除此记录"
                      class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-md text-neutral-300 opacity-0 group-hover:opacity-100 hover:bg-red-50 hover:text-red-600 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
              </button>
            </div>
          </template>
          <div class="text-xs text-neutral-300 px-3 py-2" x-show="!doneRuns.length">暂无记录</div>
        </div>
      </div>
      <!-- 退出登录（仅在开启本地认证时显示，hover 变红） -->
      <button x-show="authEnabled" @click="logout()"
              class="mt-3 w-full px-3 py-2 rounded-lg border border-neutral-200 text-sm text-neutral-500 hover:bg-red-50 hover:text-red-600 hover:border-red-300 transition-colors">
        退出登录
      </button>
    </aside>

    <!-- 右侧主区（独立滚动） -->
    <main class="flex-1 overflow-y-auto h-screen">
      <div class="max-w-3xl mx-auto px-6 pt-8 pb-12 w-full">

      <!-- 上传区（回看 / 运行中 / 已出结果时隐藏，保持顶部清爽） -->
      <div class="mb-8" x-show="!viewing && !running && !tree">
        <label class="block border border-dashed border-neutral-300 rounded-2xl bg-white px-8 py-10 text-center cursor-pointer hover:border-indigo-400 transition-colors">
          <input type="file" multiple class="hidden" @change="onFile($event)" />
          <div class="text-neutral-700 font-medium">选择文件或拖拽到此处</div>
          <div class="text-sm text-neutral-400 mt-1">支持 docx / doc / pdf，可多选（文件包）</div>
        </label>

        <!-- 已选文件清单（label 外部，避免点击触发选择；带格式徽章+大小+删除） -->
        <template x-if="fileNames.length">
          <div class="mt-4">
            <div class="text-xs font-semibold text-neutral-400 mb-2" x-text="'已选 ' + fileNames.length + ' 个文件'"></div>
            <div class="divide-y divide-neutral-100">
              <template x-for="(n, idx) in fileNames" :key="n.name + idx">
                <div class="flex items-center gap-2 px-1 py-2">
                  <span class="shrink-0 text-neutral-400">📄</span>
                  <span class="flex-1 min-w-0 text-sm text-neutral-700 truncate" x-text="n.name" :title="n.name"></span>
                  <span class="shrink-0 px-1.5 py-0.5 rounded text-[11px] font-medium bg-indigo-50 text-indigo-600" x-text="fileExt(n.name)"></span>
                  <span class="shrink-0 text-xs text-neutral-400 w-14 text-right" x-text="humanSize(n.size)"></span>
                  <button @click="removeFile(idx)" type="button"
                          class="shrink-0 w-5 h-5 flex items-center justify-center rounded text-neutral-300 hover:text-red-500 hover:bg-red-50 transition-colors"
                          title="移除">✕</button>
                </div>
              </template>
            </div>
          </div>
        </template>
        <button @click="run()" :disabled="!runId || running"
                class="mt-5 px-6 py-2.5 rounded-full bg-indigo-600 text-white text-sm font-medium disabled:opacity-30 hover:bg-indigo-700 transition-colors">
          <span x-text="running ? '处理中…' : '开始提取'"></span>
        </button>
      </div>

      <div class="mb-8 rounded-2xl bg-red-50 text-red-600 px-5 py-4 text-sm" x-show="errorMsg" x-text="errorMsg"></div>

      <!-- 处理流程 + 阶段日志窗 -->
      <section class="mb-8 rounded-2xl bg-white border border-neutral-100 p-6" x-show="phases.length">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-sm font-semibold text-neutral-400 uppercase tracking-wide">处理流程</h2>
          <!-- 总开关：全部展开 / 全部收起 -->
          <button @click="toggleAll()" type="button"
                  class="flex items-center gap-1 text-xs text-neutral-400 hover:text-indigo-600 transition-colors"
                  :title="allExpanded ? '全部收起' : '全部展开'">
            <span x-text="allExpanded ? '全部收起' : '全部展开'"></span>
            <svg class="w-3.5 h-3.5 transition-transform" :class="allExpanded ? 'rotate-180' : ''"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
        <ol class="space-y-1">
          <template x-for="(p, i) in phases" :key="p.key">
            <li>
              <div class="flex items-center px-2 py-2 rounded-xl transition-colors cursor-pointer"
                   :class="p.status === 'running' ? 'bg-indigo-50' : ''" @click="toggle(p)">
                <span class="w-5 h-5 mr-3 flex items-center justify-center shrink-0">
                  <template x-if="p.status === 'done'">
                    <span class="w-4 h-4 rounded-full bg-indigo-600 text-white text-[10px] flex items-center justify-center">✓</span>
                  </template>
                  <template x-if="p.status === 'running'">
                    <span class="w-4 h-4 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></span>
                  </template>
                  <template x-if="p.status === 'pending'">
                    <span class="w-1.5 h-1.5 rounded-full bg-neutral-300"></span>
                  </template>
                </span>
                <span class="text-sm flex-1"
                      :class="p.status === 'running' ? 'font-semibold text-indigo-700' : (p.status === 'done' ? 'text-neutral-700' : 'text-neutral-300')"
                      x-text="(i + 1) + '. ' + p.label"></span>
                <svg x-show="p.logs.length" class="w-4 h-4 text-neutral-300 transition-transform shrink-0"
                     :class="isExpanded(p) ? 'rotate-180' : ''"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
              <!-- 阶段日志：引用线对齐序号列，无盒子，长行自动换行 -->
              <div x-show="isExpanded(p) && p.logs.length"
                   class="ml-[17px] pl-5 border-l-2 border-neutral-200 mt-1 mb-2 max-h-48 overflow-y-auto space-y-1.5">
                <template x-for="(line, li) in p.logs" :key="li">
                  <div class="text-xs leading-relaxed break-words"
                       :class="line.level === 'main' ? 'text-emerald-600 font-medium' : 'text-neutral-500'"
                       x-text="line.text"></div>
                </template>
              </div>
            </li>
          </template>
        </ol>
      </section>

      <!-- 覆盖率 -->
      <section class="mb-8 rounded-2xl bg-white border border-neutral-100 p-6" x-show="tree">
        <h2 class="text-sm font-semibold text-neutral-400 uppercase tracking-wide mb-4">覆盖率</h2>
        <template x-if="tree">
          <div class="flex flex-wrap gap-8 text-sm">
            <div>
              <div class="text-neutral-400 text-xs mb-1">评分点</div>
              <div :class="cov.mapped_scoring_items===cov.total_scoring_items ? 'text-emerald-600' : 'text-amber-600'"
                   class="text-lg font-medium" x-text="cov.mapped_scoring_items + ' / ' + cov.total_scoring_items"></div>
            </div>
            <div>
              <div class="text-neutral-400 text-xs mb-1">技术条目</div>
              <div :class="cov.mapped_tech_items===cov.total_tech_items ? 'text-emerald-600' : 'text-amber-600'"
                   class="text-lg font-medium" x-text="cov.mapped_tech_items + ' / ' + cov.total_tech_items"></div>
            </div>
            <div>
              <div class="text-neutral-400 text-xs mb-1">商务</div>
              <div :class="cov.mapped_biz_items===cov.total_biz_items ? 'text-emerald-600' : 'text-amber-600'"
                   class="text-lg font-medium" x-text="cov.mapped_biz_items + ' / ' + cov.total_biz_items"></div>
            </div>
          </div>
        </template>
        <template x-if="tree && cov.unmapped && cov.unmapped.length">
          <div class="mt-4 text-sm">
            <div class="text-amber-600 font-medium mb-2">未覆盖（建议人工复核）</div>
            <div class="flex flex-wrap gap-2">
              <template x-for="u in cov.unmapped" :key="u">
                <span class="px-2 py-1 rounded-md bg-amber-50 text-amber-700 text-xs" x-text="u"></span>
              </template>
            </div>
          </div>
        </template>
      </section>

      <!-- 大纲树 -->
      <section class="rounded-2xl bg-white border border-neutral-100 p-6" x-show="tree">
        <div class="flex justify-between items-start mb-5 gap-4">
          <div class="min-w-0">
            <div class="text-xs font-semibold text-neutral-400 uppercase tracking-wide mb-1">投标文件大纲</div>
            <h2 class="text-lg font-semibold text-neutral-900 truncate" x-text="tree ? tree.project_name : ''" :title="tree ? tree.project_name : ''"></h2>
          </div>
          <div class="flex items-center gap-4 shrink-0">
            <a :href="exportUrl()" class="px-4 py-1.5 rounded-full bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-700 transition-colors whitespace-nowrap">导出 Word</a>
          </div>
        </div>
        <!-- 事件委托：x-html 内的徽章带 data-node-id，点击冒泡到此处打开来源弹窗 -->
        <div class="text-sm leading-relaxed"
             @click="const b = $event.target.closest('.source-badge'); if (b) openSource(b.dataset.nodeId)">
          <template x-for="n in (tree ? tree.nodes : [])" :key="n.id">
            <div x-html="renderNode(n, 0)"></div>
          </template>
        </div>
      </section>
      </div>
    </main>

    <!-- 来源详情弹窗：点击徽章打开，点遮罩/关闭按钮/Esc 关闭 -->
    <div x-show="sourceModal" x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-neutral-900/30 backdrop-blur-sm"
         @click="closeSource()" @keydown.escape.window="closeSource()" style="display:none">
      <div x-show="sourceModal" x-transition
           class="w-full max-w-lg max-h-[80vh] overflow-y-auto bg-white rounded-2xl shadow-xl border border-neutral-100"
           @click.stop>
        <template x-if="sourceModal">
          <div>
            <!-- 头部：节点标题 + 关闭 -->
            <div class="flex items-start justify-between gap-4 px-6 pt-6 pb-4 border-b border-neutral-100">
              <div class="min-w-0">
                <div class="text-xs font-semibold text-neutral-400 uppercase tracking-wide mb-1">来源说明</div>
                <h3 class="text-base font-semibold text-neutral-900 break-words" x-text="sourceModal.title"></h3>
              </div>
              <button @click="closeSource()" type="button"
                      class="shrink-0 w-7 h-7 flex items-center justify-center rounded-lg text-neutral-400 hover:bg-neutral-100 hover:text-neutral-700 transition-colors">✕</button>
            </div>
            <!-- 主体：按来源类型分组 -->
            <div class="px-6 py-5 space-y-5">
              <template x-for="g in sourceModal.groups" :key="g.type">
                <div>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium mb-2" :class="g.cls" x-text="g.label"></span>
                  <div class="space-y-4">
                    <template x-for="(it, ii) in g.items" :key="ii">
                      <!-- 引用风格：左竖线（来源色）+ 出处/定位小字 + 原文引用；ml-1.5 让线对齐上方徽章文字左缘 -->
                      <div class="ml-1.5 pl-4 border-l-2" :class="g.borderCls">
                        <div class="flex items-center gap-1.5 text-xs text-neutral-400 mb-1" x-show="it.document">
                          <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                          <span class="truncate" x-text="'出处：' + it.document" :title="it.document"></span>
                        </div>
                        <div class="text-xs text-neutral-400 mb-1" x-show="it.location" x-text="it.location"></div>
                        <div class="text-sm text-neutral-700 leading-relaxed break-words" x-show="it.quote && it.quote !== it.location" x-text="it.quote"></div>
                        <div class="text-sm text-neutral-400 italic" x-show="!it.quote && !it.location && !it.document">（无补充说明）</div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
