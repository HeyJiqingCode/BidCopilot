<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招标文件 → 投标大纲提取</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div x-data="app()" class="max-w-5xl mx-auto p-8">
    <h1 class="text-2xl font-semibold mb-6">招标文件 → 投标大纲提取</h1>

    <!-- 上传区 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
      <input type="file" @change="onFile($event)" class="mb-3" />
      <button @click="run()" :disabled="!runId || running"
              class="px-4 py-2 bg-indigo-600 text-white rounded-lg disabled:opacity-40">
        <span x-text="running ? '处理中…' : '开始提取'"></span>
      </button>
      <span class="ml-3 text-sm text-slate-500" x-text="fileName"></span>
    </div>

    <!-- 错误提示 -->
    <div class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-4 mb-6 text-sm"
         x-show="errorMsg" x-text="errorMsg"></div>

    <!-- 进度区：竖向时间线 + 当前阶段高亮 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6" x-show="phases.length">
      <h2 class="font-medium mb-4">处理流程</h2>
      <ol class="space-y-1">
        <template x-for="(p, i) in phases" :key="p.key">
          <li>
            <div class="flex items-center px-2 py-1.5 rounded transition-colors"
                 :class="p.status === 'running' ? 'bg-indigo-50' : ''">
              <!-- 状态圆点 -->
              <span class="w-5 h-5 mr-3 flex items-center justify-center shrink-0">
                <template x-if="p.status === 'done'">
                  <span class="w-4 h-4 rounded-full bg-emerald-500 text-white text-xs flex items-center justify-center">✓</span>
                </template>
                <template x-if="p.status === 'running'">
                  <span class="w-4 h-4 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin"></span>
                </template>
                <template x-if="p.status === 'pending'">
                  <span class="w-2 h-2 rounded-full bg-slate-300"></span>
                </template>
              </span>
              <!-- 阶段名 -->
              <span class="text-sm"
                    :class="p.status === 'running' ? 'font-bold text-indigo-700'
                            : (p.status === 'done' ? 'text-slate-500' : 'text-slate-300')"
                    x-text="(i + 1) + '. ' + p.label"></span>
            </div>
            <!-- 该阶段详细日志（缩进） -->
            <template x-for="line in p.logs" :key="line">
              <div class="ml-10 text-xs text-slate-500 py-0.5" x-text="line"></div>
            </template>
          </li>
        </template>
      </ol>
    </div>

    <!-- 覆盖率面板 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6" x-show="tree">
      <h2 class="font-medium mb-3">覆盖率</h2>
      <template x-if="tree">
        <div class="flex gap-6 text-sm">
          <div :class="cov.mapped_scoring_items===cov.total_scoring_items ? 'text-emerald-600' : 'text-amber-600'">
            评分点 <span x-text="cov.mapped_scoring_items + '/' + cov.total_scoring_items"></span>
          </div>
          <div :class="cov.mapped_tech_items===cov.total_tech_items ? 'text-emerald-600' : 'text-amber-600'">
            技术条目 <span x-text="cov.mapped_tech_items + '/' + cov.total_tech_items"></span>
          </div>
          <div :class="cov.mapped_biz_items===cov.total_biz_items ? 'text-emerald-600' : 'text-amber-600'">
            商务 <span x-text="cov.mapped_biz_items + '/' + cov.total_biz_items"></span>
          </div>
        </div>
      </template>
      <template x-if="tree && cov.unmapped.length">
        <div class="mt-3 text-sm text-rose-600">
          <div class="font-medium">未覆盖（建议人工复核）：</div>
          <ul class="list-disc ml-5">
            <template x-for="u in cov.unmapped" :key="u"><li x-text="u"></li></template>
          </ul>
        </div>
      </template>
    </div>

    <!-- 大纲树 + 导出 -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6" x-show="tree">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-medium">投标文件大纲</h2>
        <div class="flex items-center gap-3">
          <label class="text-sm flex items-center gap-1">
            <input type="checkbox" x-model="keepAiMarks" /> 保留AI建议标注
          </label>
          <a :href="exportUrl()" class="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-sm">导出 Word</a>
        </div>
      </div>
      <div class="text-sm">
        <template x-for="n in (tree ? tree.nodes : [])" :key="n.id">
          <div x-html="renderNode(n, 0)"></div>
        </template>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
